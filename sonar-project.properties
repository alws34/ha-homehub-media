# SonarQube Cloud. The CI job runs only when the SONAR_TOKEN secret is set.
# projectKey/organization must match the project created on sonarcloud.io; change them there or here.
sonar.projectKey=alws34_ha-homehub-media
sonar.organization=alws34
sonar.projectName=HomeHub Media

sonar.sources=custom_components/homehub_media,media-pc
sonar.exclusions=media-pc/tests/**,**/*.webp,**/*.png
sonar.tests=tests,media-pc/tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
# The card and TV page are tested with node --test, which produces no coverage report.
sonar.coverage.exclusions=custom_components/homehub_media/www/**
