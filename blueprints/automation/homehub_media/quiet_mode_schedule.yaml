blueprint:
  name: HomeHub Media - quiet mode on a schedule
  description: Turns HomeHub quiet mode (lower TV volume) on and off at fixed times.
  domain: automation
  source_url: https://github.com/alws34/ha-homehub-media/blob/main/blueprints/automation/homehub_media/quiet_mode_schedule.yaml
  input:
    start:
      name: Quiet from
      default: "22:00:00"
      selector:
        time: {}
    end:
      name: Quiet until
      default: "07:00:00"
      selector:
        time: {}
    quiet_switch:
      name: HomeHub quiet mode switch
      default: switch.homehub_media_quiet_mode
      selector:
        entity:
          filter: [{ domain: switch, integration: homehub_media }]
mode: single
triggers:
  - trigger: time
    at: !input start
    id: start
  - trigger: time
    at: !input end
    id: end
actions:
  - action: "switch.turn_{{ 'on' if trigger.id == 'start' else 'off' }}"
    target:
      entity_id: !input quiet_switch
