[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "media-pc/tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
# defaults (E4, E7, E9, F) plus bugbear, bandit (security) and async-in-event-loop checks
extend-select = ["B", "S", "ASYNC"]
ignore = ["ASYNC109"]  # `timeout` parameters here are aiohttp ClientTimeouts, not asyncio deadlines

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B905", "ASYNC110", "ASYNC240"]  # asserts, fake tokens, polling helpers in tests
"media-pc/tests/*" = ["S"]

[tool.coverage.run]
source = ["custom_components/homehub_media", "media-pc"]
omit = ["media-pc/tests/*"]
relative_files = true  # repo-relative paths in coverage.xml, as SonarQube Cloud expects
