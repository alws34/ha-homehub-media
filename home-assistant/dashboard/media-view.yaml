type: vertical-stack
cards:
  - type: custom:button-card
    name: Media
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border: none
        - padding: 4px 8px
      name:
        - justify-self: start
        - color: var(--hub-section-text)
        - font-size: 26px
        - font-weight: 700
  - type: custom:mushroom-template-card
    entity: sensor.homehub_media_status
    primary: '{{ states(''sensor.homehub_media_status'') }}'
    secondary: >-
      {% set tv_entity = 'media_player.your_primary_tv' %}

      {% set tv_state = states(tv_entity) %}

      {% set raw_source = state_attr(tv_entity, 'source') %}

      {% set source_names = {
        'digital_tv': 'Live TV',
        'TV/HDMI': 'TV / HDMI'
      } %}

      {% set source = source_names.get(raw_source, raw_source |
      default('TV', true) | replace('_', ' ') | title) %}

      {% set volume = state_attr(tv_entity, 'volume_level') %}

      {% set muted = state_attr(tv_entity, 'is_volume_muted') %}

      {% set partner = states('media_player.your_streaming_box') %}

      {% if tv_state in ['off', 'unknown', 'unavailable'] %}
        TV off
      {% else %}
        {{ source }}{% if volume is number %} · Volume {{ (volume * 100) | round(0) | int }}%{% endif %}{% if muted %} · Muted{% endif %}
      {% endif %}{% if partner not in ['off', 'unknown', 'unavailable'] %} ·
      Partner on{% endif %}
    icon: |-
      {{ state_attr('sensor.homehub_media_status', 'icon')
         | default('mdi:multimedia', true) }}
    icon_color: white
    layout: horizontal
    multiline_secondary: true
    tap_action:
      action: more-info
    hold_action:
      action: none
    card_mod:
      style:
        .: |
          ha-card {
            min-height: 108px;
            border-radius: 20px;
            padding: 12px;
            backdrop-filter: blur(6px);
            color: white !important;
            --primary-text-color: white !important;
            --secondary-text-color: rgba(255,255,255,0.82) !important;

            background:
              {% if is_state('input_select.homehub_media_phase', 'Needs reset') %}
                linear-gradient(145deg, rgba(170,45,45,0.78), rgba(82,22,22,0.72));
              {% elif is_state('input_select.homehub_media_phase', 'Transitioning') %}
                linear-gradient(145deg, rgba(150,112,42,0.76), rgba(78,55,20,0.70));
              {% elif is_state('input_boolean.homehub_media_quiet_mode', 'on') %}
                linear-gradient(145deg, rgba(74,90,165,0.72), rgba(35,42,94,0.68));
              {% else %}
                var(--hub-card-bg);
              {% endif %}
          }
        mushroom-shape-icon$: |
          .shape {
            background: rgba(255,255,255,0.10) !important;
          }

          ha-icon {
            color: white !important;
          }
        mushroom-state-info$: |
          .primary {
            color: white !important;
            font-size: 21px !important;
            font-weight: 700 !important;
          }

          .secondary {
            color: rgba(255,255,255,0.82) !important;
            font-size: 13px !important;
          }
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: input_boolean.homehub_media_quiet_mode
        primary: Quiet Mode
        secondary: |-
          {% if is_state('input_boolean.homehub_media_quiet_mode', 'on') %}
            On · {{ states('input_number.homehub_media_quiet_volume') | int(10) }}%
          {% else %}
            Off
          {% endif %}
        icon: mdi:weather-night
        icon_color: white
        layout: horizontal
        tap_action:
          action: perform-action
          perform_action: script.homehub_media_toggle_quiet
        hold_action:
          action: none
        card_mod:
          style:
            .: |
              ha-card {
                min-height: 88px;
                border-radius: 18px;
                backdrop-filter: blur(6px);
                background:
                  {% if is_state('input_boolean.homehub_media_quiet_mode', 'on') %}
                    linear-gradient(145deg, rgba(47,126,195,0.72), rgba(30,57,112,0.70));
                  {% else %}
                    var(--hub-card-bg-soft);
                  {% endif %}
                color: white !important;
                --primary-text-color: white !important;
                --secondary-text-color: rgba(255,255,255,0.80) !important;
              }
            mushroom-shape-icon$: |
              .shape { background: transparent !important; }
              ha-icon { color: white !important; }
      - type: custom:decluttering-card
        template: homehub_media_placeholder_card
        variables:
          - primary: Soundbar HDMI
          - secondary: Not integrated
          - icon: mdi:hdmi-port
      - type: tile
        entity: media_player.your_primary_tv
        name: TV Volume
        icon: mdi:volume-medium
        color: light-blue
        features_position: bottom
        features:
          - type: media-player-volume-slider
            show_mute_button: true
        card_mod:
          style: |
            ha-card {
              min-height: 88px;
              border-radius: 18px;
              background: var(--hub-card-bg-soft);
              backdrop-filter: blur(6px);
              color: white !important;
              --primary-text-color: white !important;
              --secondary-text-color: rgba(255,255,255,0.82) !important;
            }
  - type: custom:button-card
    name: Audio
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border: none
        - padding: 8px 8px 0 8px
      name:
        - justify-self: start
        - color: var(--hub-section-text)
        - font-size: 20px
        - font-weight: 700
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:decluttering-card
        template: homehub_media_placeholder_card
        variables:
          - primary: Audio Only
          - icon: mdi:waveform
      - type: custom:decluttering-card
        template: homehub_media_placeholder_card
        variables:
          - primary: Bluetooth
          - icon: mdi:bluetooth
      - type: custom:decluttering-card
        template: homehub_media_placeholder_card
        variables:
          - primary: Soundbar HDMI
          - icon: mdi:hdmi-port
      - type: custom:decluttering-card
        template: homehub_media_placeholder_card
        variables:
          - primary: Music
          - icon: mdi:music-note
  - type: custom:button-card
    name: Controls
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border: none
        - padding: 8px 8px 0 8px
      name:
        - justify-self: start
        - color: var(--hub-section-text)
        - font-size: 20px
        - font-weight: 700
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Reset Media
        secondary: Restore Partner TV
        icon: mdi:restore
        icon_color: white
        layout: horizontal
        tap_action:
          action: perform-action
          perform_action: script.homehub_media_reset
        hold_action:
          action: none
        card_mod:
          style:
            .: |
              ha-card {
                min-height: 92px;
                border-radius: 18px;
                background: linear-gradient(
                  145deg,
                  rgba(150,112,42,0.68),
                  rgba(78,55,20,0.64)
                );
                backdrop-filter: blur(6px);
                color: white !important;
                --primary-text-color: white !important;
                --secondary-text-color: rgba(255,255,255,0.80) !important;
              }
            mushroom-shape-icon$: |
              .shape { background: transparent !important; }
              ha-icon { color: white !important; }
      - type: custom:mushroom-template-card
        primary: Restart Partner App
        secondary: Coming later
        icon: mdi:restart
        icon_color: white
        layout: horizontal
        tap_action:
          action: none
        hold_action:
          action: none
        card_mod:
          style:
            .: |
              ha-card {
                min-height: 92px;
                border-radius: 18px;
                background: var(--hub-card-bg-soft);
                backdrop-filter: blur(6px);
                opacity: 0.72;
                color: white !important;
                --primary-text-color: white !important;
                --secondary-text-color: rgba(255,255,255,0.58) !important;
              }
            mushroom-shape-icon$: |
              .shape { background: transparent !important; }
              ha-icon { color: rgba(255,255,255,0.72) !important; }
      - type: custom:mushroom-template-card
        primary: 'Off'
        secondary: Turn everything off
        icon: mdi:power
        icon_color: white
        layout: horizontal
        tap_action:
          action: perform-action
          perform_action: script.homehub_media_off
        hold_action:
          action: none
        card_mod:
          style:
            .: |
              ha-card {
                min-height: 92px;
                border-radius: 18px;
                background: linear-gradient(
                  145deg,
                  rgba(145,54,54,0.72),
                  rgba(76,28,28,0.68)
                );
                backdrop-filter: blur(6px);
                color: white !important;
                --primary-text-color: white !important;
                --secondary-text-color: rgba(255,255,255,0.80) !important;
              }
            mushroom-shape-icon$: |
              .shape { background: transparent !important; }
              ha-icon { color: #ff7373 !important; }
  - type: custom:button-card
    name: Volume Policy
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background: transparent
        - box-shadow: none
        - border: none
        - padding: 8px 8px 0 8px
      name:
        - justify-self: start
        - color: var(--hub-section-text)
        - font-size: 20px
        - font-weight: 700
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: input_number.homehub_media_normal_volume
        name: Normal Volume
        icon: mdi:volume-medium
        color: indigo
        features:
          - type: numeric-input
            style: slider
        card_mod:
          style: |
            ha-card {
              border-radius: 18px;
              background: var(--hub-card-bg);
              backdrop-filter: blur(6px);
              color: white !important;
              --primary-text-color: white !important;
              --secondary-text-color: rgba(255,255,255,0.82) !important;
            }
      - type: tile
        entity: input_number.homehub_media_quiet_volume
        name: Quiet Volume
        icon: mdi:volume-low
        color: indigo
        features:
          - type: numeric-input
            style: slider
        card_mod:
          style: |
            ha-card {
              border-radius: 18px;
              background: var(--hub-card-bg);
              backdrop-filter: blur(6px);
              color: white !important;
              --primary-text-color: white !important;
              --secondary-text-color: rgba(255,255,255,0.82) !important;
            }
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        icon: mdi:arrow-left
        content: Back
        tap_action:
          action: navigate
          navigation_path: /home-hub
    card_mod:
      style: |
        ha-card {
          margin-top: 14px;
          border-radius: 18px;
          padding: 10px;
          background: var(--hub-small-card-bg);
          backdrop-filter: blur(6px);
        }
  - type: custom:button-card
    entity: input_boolean.homehub_media_remote_drawer_open
    triggers_update:
      - input_boolean.homehub_media_remote_drawer_open
      - input_select.homehub_media_remote_target
      - input_number.homehub_media_ambience_ui_original_volume
      - input_number.homehub_media_ambience_ui_soundtrack_volume
      - input_select.homehub_media_ambience_ui_editor_mode
      - input_select.homehub_media_ambience_ui_soundtrack
      - input_select.homehub_media_ambience_ui_visual
      - input_boolean.homehub_media_ambience_ui_lighting_enabled
      - input_button.homehub_media_ambience_ui_refresh_placeholder
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      remote:
        card:
          type: vertical-stack
          cards:
            - type: conditional
              conditions:
                - condition: state
                  entity: input_select.homehub_media_ambience_ui_editor_mode
                  state: Closed
              card:
                type: custom:homehub-remote-swipe-card
                entity: input_select.homehub_media_remote_target
                options:
                  - Samsung TV
                  - Partner TV
                  - Ambience
                  - Media Hub
                threshold: 55
                wrap: true
                allow_mouse: true
            - type: grid
              columns: 4
              square: false
              card_mod:
                style: |
                  :host {
                    display: block;
                    margin-bottom: 16px;
                    padding: 6px 7px 7px 7px;
                    overflow: visible !important;
                  }
              cards:
                - type: custom:button-card
                  entity: input_select.homehub_media_remote_target
                  triggers_update:
                    - input_select.homehub_media_remote_target
                  icon: mdi:television-classic
                  show_name: false
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    target:
                      entity_id: input_select.homehub_media_remote_target
                    data:
                      option: Samsung TV
                  hold_action:
                    action: none
                  styles:
                    card:
                      - height: 46px
                      - border-radius: 23px
                      - padding: 4px 8px
                      - background: |
                          [[[
                            return entity.state === 'Samsung TV'
                              ? 'linear-gradient(145deg, rgba(43,166,255,0.86), rgba(40,104,210,0.56))'
                              : 'rgba(255,255,255,0.030)';
                          ]]]
                      - border: |
                          [[[
                            return entity.state === 'Samsung TV'
                              ? '1px solid rgba(179,232,255,0.98)'
                              : '1px solid rgba(255,255,255,0.075)';
                          ]]]
                      - box-shadow: |
                          [[[
                            return entity.state === 'Samsung TV'
                              ? '0 0 0 1px rgba(64,178,255,0.24), 0 0 14px rgba(40,166,255,0.42), inset 0 1px 0 rgba(255,255,255,0.24)'
                              : 'inset 0 1px 0 rgba(255,255,255,0.045)';
                          ]]]
                      - transform: |
                          [[[
                            return entity.state === 'Samsung TV'
                              ? 'scale(1.02)'
                              : 'scale(0.99)';
                          ]]]
                      - opacity: |
                          [[[
                            return entity.state === 'Samsung TV' ? '1' : '0.58';
                          ]]]
                      - z-index: |
                          [[[
                            return entity.state === 'Samsung TV' ? '3' : '1';
                          ]]]
                      - backdrop-filter: blur(12px)
                      - transition: all 180ms ease
                    grid:
                      - grid-template-areas: '"i"'
                      - grid-template-columns: 1fr
                    icon:
                      - width: 24px
                      - justify-self: center
                      - align-self: center
                      - color: |
                          [[[
                            return entity.state === 'Samsung TV'
                              ? 'white'
                              : 'rgba(255,255,255,0.62)';
                          ]]]
                      - filter: |
                          [[[
                            return entity.state === 'Samsung TV'
                              ? 'drop-shadow(0 0 6px rgba(131,220,255,0.90))'
                              : 'none';
                          ]]]
                  state:
                    - value: Samsung TV
                      styles:
                        card:
                          - background: >-
                              linear-gradient(145deg, rgba(50,176,255,0.96),
                              rgba(30,103,211,0.76))
                          - border: 2px solid rgba(202,241,255,1)
                          - box-shadow: >-
                              0 0 0 1px rgba(68,185,255,0.28), 0 0 14px
                              rgba(56,184,255,0.62), inset 0 1px 0
                              rgba(255,255,255,0.34)
                          - opacity: 1
                          - transform: scale(1.02)
                        icon:
                          - color: white
                          - filter: drop-shadow(0 0 7px rgba(208,245,255,1))
                - type: custom:button-card
                  entity: input_select.homehub_media_remote_target
                  triggers_update:
                    - input_select.homehub_media_remote_target
                  show_name: false
                  show_icon: false
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    target:
                      entity_id: input_select.homehub_media_remote_target
                    data:
                      option: Partner TV
                  hold_action:
                    action: none
                  custom_fields:
                    logo: |
                      [[[
                        return `<img src="/local/homehub/media/apps/partner_tv.svg" style="width:31px;height:31px;object-fit:contain;display:block;margin:0 auto;">`;
                      ]]]
                  styles:
                    card:
                      - height: 46px
                      - border-radius: 23px
                      - padding: 4px 8px
                      - background: |
                          [[[
                            return entity.state === 'Partner TV'
                              ? 'linear-gradient(145deg, rgba(35,220,204,0.78), rgba(28,118,184,0.48))'
                              : 'rgba(255,255,255,0.030)';
                          ]]]
                      - border: |
                          [[[
                            return entity.state === 'Partner TV'
                              ? '1px solid rgba(164,255,244,0.98)'
                              : '1px solid rgba(255,255,255,0.075)';
                          ]]]
                      - box-shadow: |
                          [[[
                            return entity.state === 'Partner TV'
                              ? '0 0 0 1px rgba(67,229,214,0.22), 0 0 14px rgba(43,220,205,0.38), inset 0 1px 0 rgba(255,255,255,0.24)'
                              : 'inset 0 1px 0 rgba(255,255,255,0.045)';
                          ]]]
                      - transform: |
                          [[[
                            return entity.state === 'Partner TV'
                              ? 'scale(1.02)'
                              : 'scale(0.99)';
                          ]]]
                      - opacity: |
                          [[[
                            return entity.state === 'Partner TV' ? '1' : '0.58';
                          ]]]
                      - z-index: |
                          [[[
                            return entity.state === 'Partner TV' ? '3' : '1';
                          ]]]
                      - backdrop-filter: blur(12px)
                      - transition: all 180ms ease
                    grid:
                      - grid-template-areas: '"logo"'
                      - grid-template-columns: 1fr
                    custom_fields:
                      logo:
                        - align-self: center
                        - justify-self: center
                        - opacity: |
                            [[[
                              return entity.state === 'Partner TV' ? '1' : '0.62';
                            ]]]
                        - filter: |
                            [[[
                              return entity.state === 'Partner TV'
                                ? 'drop-shadow(0 0 6px rgba(91,255,237,0.75))'
                                : 'none';
                            ]]]
                  state:
                    - value: Partner TV
                      styles:
                        card:
                          - background: >-
                              linear-gradient(145deg, rgba(38,225,210,0.94),
                              rgba(21,126,188,0.76))
                          - border: 2px solid rgba(193,255,248,1)
                          - box-shadow: >-
                              0 0 0 1px rgba(76,232,217,0.26), 0 0 14px
                              rgba(57,239,220,0.58), inset 0 1px 0
                              rgba(255,255,255,0.34)
                          - opacity: 1
                          - transform: scale(1.02)
                        custom_fields:
                          logo:
                            - opacity: 1
                            - filter: drop-shadow(0 0 7px rgba(151,255,243,0.98))
                - type: custom:button-card
                  entity: input_select.homehub_media_remote_target
                  triggers_update:
                    - input_select.homehub_media_remote_target
                  icon: mdi:weather-sunset
                  show_name: false
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    target:
                      entity_id: input_select.homehub_media_remote_target
                    data:
                      option: Ambience
                  hold_action:
                    action: none
                  styles:
                    card:
                      - height: 46px
                      - border-radius: 23px
                      - padding: 4px 8px
                      - background: |
                          [[[
                            return entity.state === 'Ambience'
                              ? 'linear-gradient(145deg, rgba(245,181,72,0.88), rgba(190,105,42,0.58))'
                              : 'rgba(255,255,255,0.030)';
                          ]]]
                      - border: |
                          [[[
                            return entity.state === 'Ambience'
                              ? '1px solid rgba(255,224,164,0.98)'
                              : '1px solid rgba(255,255,255,0.075)';
                          ]]]
                      - box-shadow: |
                          [[[
                            return entity.state === 'Ambience'
                              ? '0 0 0 1px rgba(255,185,78,0.22), 0 0 14px rgba(255,173,64,0.36), inset 0 1px 0 rgba(255,255,255,0.24)'
                              : 'inset 0 1px 0 rgba(255,255,255,0.045)';
                          ]]]
                      - transform: |
                          [[[
                            return entity.state === 'Ambience'
                              ? 'scale(1.02)'
                              : 'scale(0.99)';
                          ]]]
                      - opacity: |
                          [[[
                            return entity.state === 'Ambience' ? '1' : '0.58';
                          ]]]
                      - z-index: |
                          [[[
                            return entity.state === 'Ambience' ? '3' : '1';
                          ]]]
                      - backdrop-filter: blur(12px)
                      - transition: all 180ms ease
                    grid:
                      - grid-template-areas: '"i"'
                      - grid-template-columns: 1fr
                    icon:
                      - width: 25px
                      - justify-self: center
                      - align-self: center
                      - color: |
                          [[[
                            return entity.state === 'Ambience'
                              ? 'white'
                              : 'rgba(255,255,255,0.62)';
                          ]]]
                      - filter: |
                          [[[
                            return entity.state === 'Ambience'
                              ? 'drop-shadow(0 0 7px rgba(255,220,158,0.96))'
                              : 'none';
                          ]]]
                  state:
                    - value: Ambience
                      styles:
                        card:
                          - background: >-
                              linear-gradient(145deg, rgba(248,187,77,0.96),
                              rgba(192,103,40,0.78))
                          - border: 2px solid rgba(255,232,185,1)
                          - box-shadow: >-
                              0 0 0 1px rgba(255,189,86,0.26), 0 0 14px
                              rgba(255,182,76,0.60), inset 0 1px 0
                              rgba(255,255,255,0.34)
                          - opacity: 1
                          - transform: scale(1.02)
                        icon:
                          - color: white
                          - filter: drop-shadow(0 0 7px rgba(255,235,196,1))
                - type: custom:button-card
                  entity: input_select.homehub_media_remote_target
                  triggers_update:
                    - input_select.homehub_media_remote_target
                  icon: mdi:movie-open-play
                  show_name: false
                  tap_action:
                    action: call-service
                    service: input_select.select_option
                    target:
                      entity_id: input_select.homehub_media_remote_target
                    data:
                      option: Media Hub
                  hold_action:
                    action: none
                  styles:
                    card:
                      - height: 46px
                      - border-radius: 23px
                      - padding: 4px 8px
                      - background: |
                          [[[
                            return entity.state === 'Media Hub'
                              ? 'linear-gradient(145deg, rgba(137,104,255,0.88), rgba(55,111,210,0.58))'
                              : 'rgba(255,255,255,0.030)';
                          ]]]
                      - border: |
                          [[[
                            return entity.state === 'Media Hub'
                              ? '1px solid rgba(213,202,255,0.98)'
                              : '1px solid rgba(255,255,255,0.075)';
                          ]]]
                      - box-shadow: |
                          [[[
                            return entity.state === 'Media Hub'
                              ? '0 0 0 1px rgba(154,126,255,0.22), 0 0 14px rgba(124,111,255,0.38), inset 0 1px 0 rgba(255,255,255,0.24)'
                              : 'inset 0 1px 0 rgba(255,255,255,0.045)';
                          ]]]
                      - transform: |
                          [[[
                            return entity.state === 'Media Hub'
                              ? 'scale(1.02)'
                              : 'scale(0.99)';
                          ]]]
                      - opacity: |
                          [[[
