          entity: input_boolean.homehub_media_remote_drawer_open
          icon: |
            [[[
              return entity.state === 'on'
                ? 'mdi:chevron-right'
                : 'mdi:chevron-left';
            ]]]
          show_name: false
          show_state: false
          tap_action:
            action: toggle
          hold_action:
            action: none
          styles:
            card:
              - width: 28px
              - height: 70px
              - border-radius: 18px 0 0 18px
              - background: >-
                  linear-gradient(180deg, rgba(31,84,133,0.86),
                  rgba(12,35,67,0.94))
              - backdrop-filter: blur(14px)
              - border: 1px solid rgba(113,194,255,0.30)
              - border-right: none
              - box-shadow: >-
                  -7px 0 20px rgba(0,0,0,0.24), 0 0 12px
                  rgba(32,142,230,0.12)
              - padding: 4px
            icon:
              - width: 19px
              - color: rgba(244,251,255,0.96)
    card_mod:
      style: |
        :host {
          --homehub-remote-body-width: min(260px, calc(100vw - 46px));
          position: fixed !important;
          right: max(8px, env(safe-area-inset-right, 0px)) !important;
          top: 50% !important;
          transform: translateY(-50%) !important;
          width:
            {% if is_state('input_boolean.homehub_media_remote_drawer_open', 'on') %}
              calc(var(--homehub-remote-body-width) + 28px)
            {% else %}
              28px
            {% endif %} !important;
          height:
            {% if is_state('input_boolean.homehub_media_remote_drawer_open', 'on') %}
              min(88vh, 820px)
            {% else %}
              70px
            {% endif %} !important;
          margin: 0 !important;
          z-index: 2147483000 !important;
          overflow: visible !important;
          transition:
            width 340ms cubic-bezier(0.22, 1, 0.36, 1),
            height 240ms ease !important;
        }

        @media (max-width: 869px) {
          :host {
            right: max(4px, env(safe-area-inset-right, 0px)) !important;
            width:
              {% if is_state('input_boolean.homehub_media_remote_drawer_open', 'on') %}
                calc(var(--homehub-remote-body-width) + 28px)
              {% else %}
                28px
              {% endif %} !important;
            height:
              {% if is_state('input_boolean.homehub_media_remote_drawer_open', 'on') %}
                min(88vh, 820px)
              {% else %}
                70px
              {% endif %} !important;
          }
        }
    styles:
      card:
        - width: 100% !important
        - min-width: 100% !important
        - max-width: 100% !important
        - height: 100% !important
        - min-height: 100% !important
        - max-height: 100% !important
        - box-sizing: border-box
        - overflow: visible
        - padding: 0
        - border: none
        - background: transparent
        - box-shadow: none
      grid:
        - width: 100% !important
        - height: 100% !important
        - min-height: 100% !important
        - grid-template-areas: '"handle remote"'
        - grid-template-columns: |
            [[[
              return entity.state === 'on'
                ? '28px minmax(0, 1fr)'
                : '28px 0';
            ]]]
        - grid-template-rows: minmax(0, 1fr)
        - align-items: stretch
        - column-gap: 0
      custom_fields:
        remote:
          - width: var(--homehub-remote-body-width) !important
          - min-width: 0 !important
          - max-width: var(--homehub-remote-body-width) !important
          - height: 100% !important
          - min-height: 100% !important
          - max-height: 100% !important
          - align-self: stretch
          - justify-self: stretch
          - box-sizing: border-box
          - padding: 28px 32px 28px 32px
          - margin: 0
          - overflow-y: auto
          - overflow-x: hidden
          - scrollbar-width: thin
          - scrollbar-color: rgba(122,199,255,0.30) transparent
          - background: |
              [[[
                return entity.state === 'on'
                  ? 'radial-gradient(circle at 48% 8%, rgba(52,145,228,0.20), transparent 32%), radial-gradient(circle at 25% 66%, rgba(27,118,205,0.12), transparent 34%), linear-gradient(160deg, rgba(17,48,82,0.96), rgba(8,24,47,0.97) 52%, rgba(10,34,62,0.96))'
                  : 'transparent';
              ]]]
          - backdrop-filter: blur(18px) saturate(125%)
          - -webkit-backdrop-filter: blur(18px) saturate(125%)
          - border-radius: |
              [[[
                return entity.state === 'on'
                  ? '92px 92px 76px 76px / 118px 118px 92px 92px'
                  : '0';
              ]]]
          - border: |
              [[[
                return entity.state === 'on'
                  ? '1px solid rgba(110,196,255,0.24)'
                  : 'none';
              ]]]
          - box-shadow: |
              [[[
                return entity.state === 'on'
                  ? 'inset 0 1px 0 rgba(255,255,255,0.10), inset 0 -1px 0 rgba(78,160,225,0.08)'
                  : 'none';
              ]]]
          - clip-path: none
          - filter: |
              [[[
                return entity.state === 'on'
                  ? 'drop-shadow(-12px 12px 30px rgba(0,0,0,0.34)) drop-shadow(0 0 10px rgba(48,157,244,0.22))'
                  : 'none';
              ]]]
          - opacity: |
              [[[
                return entity.state === 'on' ? '1' : '0';
              ]]]
          - pointer-events: |
              [[[
                return entity.state === 'on' ? 'auto' : 'none';
              ]]]
          - transition: opacity 140ms ease, filter 220ms ease
          - contain: inline-size
        handle:
          - align-self: center
          - justify-self: start
          - overflow: visible
          - z-index: 5
grid_options:
  columns: 12
  rows: auto
