decluttering_templates:
  homehub_media_placeholder_card:
    default:
      - primary: Not configured
      - secondary: ""
      - icon: mdi:help-circle-outline
    card:
      type: custom:button-card
      name: '[[primary]]'
      icon: '[[icon]]'
      label: '[[secondary]]'
      show_label: true
      show_state: false
      tap_action:
        action: none
      styles:
        card:
          - min-height: 72px
          - border-radius: 18px
          - background: var(--hub-card-bg-soft, rgba(10, 26, 47, 0.72))
          - border: 1px solid rgba(154, 210, 255, 0.16)
          - box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 4px 12px rgba(0,0,0,0.12)
          - padding: 8px
        icon:
          - width: 24px
          - color: rgba(218, 240, 255, 0.92)
        name:
          - font-size: 11px
          - color: white
        label:
          - font-size: 9px
          - color: rgba(234, 244, 255, 0.72)
