  homehub_media_hub_open_sonarr:
    alias: HomeHub Media Hub · Open Sonarr
    description: Stops Ambience, opens Sonarr in the Ubuntu Media Hub browser, then selects the PC HDMI input.
    icon: mdi:television-guide
    mode: single
    sequence:
      - action: rest_command.homehub_media_hub_open_mode_backend
        data:
          mode: sonarr
        response_variable: media_hub_open_response
      - if:
          - condition: template
            value_template: >-
              {{ media_hub_open_response.status | default(0) | int == 200 }}
        then:
          - action: script.homehub_media_select_pc_source
        else:
          - stop: "Media Hub backend did not confirm Sonarr open"
            error: true

  homehub_media_hub_open_radarr:
