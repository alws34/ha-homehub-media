  # -------------------------------------------------------------------------
  # Partner TV channel keypad
  #
  # Robust debounce architecture:
  #   - Each dashboard digit calls a dedicated static script (no script fields).
  #   - The digit script updates the input_text immediately and starts a separate
  #     debounce script non-blocking via script.turn_on.
  #   - The debounce script is mode: restart, so every new digit restarts only
  #     the 1.5 s timer; it does not interrupt the digit that is updating the buffer.
  #   - After 1.5 s of silence, the buffered channel is sent using the confirmed
  #     media_player.play_media channel action and the buffer is cleared.
  # -------------------------------------------------------------------------
  homehub_media_partner_channel_debounce:
    alias: HomeHub Media · Partner Channel Debounce
    description: Waits 1.5 seconds after the last digit, then sends the channel.
    icon: mdi:timer-outline
    mode: restart
    max_exceeded: silent
    sequence:
      - delay:
          milliseconds: 1500

      - variables:
          channel_text: >-
            {{ states('input_text.homehub_media_partner_channel_buffer') }}

      - if:
          - condition: template
            value_template: >-
              {{ channel_text | regex_match('^[0-9]{1,3}$') }}
        then:
          - action: media_player.play_media
            target:
              entity_id: media_player.your_streaming_box
            data:
              media:
                media_content_type: channel
                media_content_id: "{{ channel_text | int }}"

          - action: input_text.set_value
            target:
              entity_id: input_text.homehub_media_partner_channel_buffer
            data:
              value: ""

  homehub_media_partner_channel_submit:
    alias: HomeHub Media · Partner Channel Submit
    description: Immediately sends the currently buffered Partner channel.
    icon: mdi:check-circle-outline
    mode: restart
    max_exceeded: silent
    sequence:
      - action: script.turn_off
        continue_on_error: true
        target:
          entity_id: script.homehub_media_partner_channel_debounce

      - variables:
          channel_text: >-
            {{ states('input_text.homehub_media_partner_channel_buffer') }}

      - if:
          - condition: template
            value_template: >-
              {{ channel_text | regex_match('^[0-9]{1,3}$') }}
        then:
          - action: media_player.play_media
            target:
              entity_id: media_player.your_streaming_box
            data:
              media:
                media_content_type: channel
                media_content_id: "{{ channel_text | int }}"

          - action: input_text.set_value
            target:
              entity_id: input_text.homehub_media_partner_channel_buffer
            data:
              value: ""

  homehub_media_partner_channel_digit_0:
    alias: HomeHub Media · Partner Channel Digit 0
    icon: mdi:numeric-0-box-outline
    mode: restart
    max_exceeded: silent
    sequence:
      - variables:
          current_buffer: >-
            {% set current = states('input_text.homehub_media_partner_channel_buffer') %}
            {{ '' if current in ['', 'unknown', 'unavailable', 'none'] else current }}
          next_buffer: >-
            {{ (current_buffer ~ '0')[:3] }}

      - action: input_text.set_value
        target:
          entity_id: input_text.homehub_media_partner_channel_buffer
        data:
          value: "{{ next_buffer }}"

