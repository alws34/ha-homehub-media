  homehub_media_room_scene_stop:
    alias: HomeHub Media · Room Scene · Stop + Restore
    description: Restores the exact dynamic snapshot for Dinner, Reading, Game Night or Chill without changing TV activity.
    icon: mdi:lightbulb-group-off-outline
    mode: restart
    max_exceeded: silent
    sequence:
      # Configurable ambience modes own host playback while active.
      - action: script.homehub_ambient_host_stop
        continue_on_error: true

      - action: input_boolean.turn_off
