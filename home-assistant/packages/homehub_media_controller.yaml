# =============================================================================
# Home Hub Media Controller — Stage 2J Dual-MPV Profiles + Lighting Toggle
# Version: 3.3.1 (2026-08-29)
#
# Baseline:
#   - Preserves the deployed v3.1 Fireplace architecture.
#   - Adds Movie Time room modifier.
#   - Adds real observed Samsung foreground-app mapping.
#   - Adds the Wi-Fi -> ESP32 -> BLE HID TV keyboard backend.
#
# Confirmed devices used by this package:
#   Samsung TV (SamsungTV Smart): media_player.your_samsung_tv
#   Samsung TV (native SmartThings):
#                                    media_player.your_primary_tv
#   Partner Android TV box:         media_player.your_streaming_box
#   SmartThings location:           your SmartThings TV location (TV only)
#   Fireplace Tuya helper:          homehub_tuya_scene v0.2.0+
#
# Stage 1.4 behavior preserved:
#   - Partner TV activity via HDMI1.
#   - Cold-start SmartThings ConflictError protection.
#   - HDMI1 verification/retries.
#   - Samsung Home activity.
#   - Off / Reset / Quiet Mode / Night Mode authority.
#
# Stage 2A–2F behavior preserved:
#   - App enable/disable helpers and Samsung launch/refresh.
#   - Multi-mode side remote drawer.
#   - Partner numeric channel buffer with dedicated static 0–9 scripts.
#   - Samsung volume/mute routing.
#
# Stage 2G / v3.1 Fireplace engine preserved:
#   - Living room uses the proven Matter transition pattern.
#   - Kitchen island and Pillar use HomeHub Tuya Scene v0.2.0 with
#     engine:auto and profile:natural.
#   - Pillar natural profile: brightness 6–34%, temperature swing 45.
#   - Kitchen natural profile: brightness 8–44%, temperature swing 70.
#   - engine:auto may use the local/raw path when supported and falls back
#     according to the custom component implementation.
#   - Zigbee sofa strip retriggers native Breathe every 4 seconds.
#   - Kitchen ceiling is OFF during Fireplace.
#   - Exact runtime snapshots/restoration remain fault-isolated.
#
# Stage 2H / Movie Time:
#   - One-shot cinema room modifier; does not own the TV/app source.
#   - Exact runtime snapshots/restoration for affected room devices.
#   - Mood group ON; strip brightness adjusted separately.
#   - Current living-room shutter closes only when the configured sun/glare
#     condition is true.
#   - Manual changes made while Movie Time is active are not re-enforced.
#   - Partner TV / Samsung Apps may coexist while Movie Time remains active.
#
# Stage 2I / Observed App + TV Keyboard:
#   - Native SmartThings tv_channel_name is the primary real foreground-app
#     observation, so physical Samsung remote changes are reflected in HA.
#   - Confirmed mappings:
#       org.tizen.netflix-app       -> Netflix
#       org.tizen.primevideo        -> Amazon Prime
#       Di0N6xZMEA.disneyplus       -> Disney+
#       com.samsung.tv.aria-video   -> Apple TV
#       5b8c3eb16b.BeamCTVDev       -> HBO Max
#       9Ur5IzDKqV.TizenYouTube     -> YouTube
#   - Observed app is kept separate from requested Home Hub activity.
#   - App highlighting uses the real observed app.
#   - Keyboard backend is enabled only for apps proven to accept BLE HID text:
#       Netflix, YouTube, Apple TV, HBO Max (HBO remains app-side limited).
#   - Prime Video and Disney+ remain disabled for BLE HID text.
#   - Keyboard submission uses the same proven /type path as Developer Tools.
#   - Browser Enter submits the text and closes the native keyboard; it does
#     NOT inject an additional BLE Enter into the TV app.
#   - Separate Backspace / Enter / Clear scripts remain available.
#
# Deliberately still deferred:
#   PS5, Grundig soundbar/IR, channel favourites, remaining ambience modes,
#   Partner+ force-stop/relaunch, and upper-control-strip redesign.
# =============================================================================

input_select:
  homehub_media_requested_activity:
    name: HomeHub Media Requested Activity
    icon: mdi:motion-play-outline
    options:
      - "Off"
      - Partner TV
      - Samsung Apps

  homehub_media_phase:
    name: HomeHub Media Phase
    icon: mdi:list-status
    options:
      - Ready
      - Transitioning
      - Needs reset
      - Blocked

  homehub_media_remote_target:
    name: HomeHub Media Remote Target
    icon: mdi:remote-tv
    options:
      - Samsung TV
      - Partner TV
      - Ambience
      - Media Hub

  homehub_media_ambience_mode:
    name: HomeHub Media Ambience Mode
    icon: mdi:weather-sunset
    options:
      - "Off"
      - Fireplace
      - Dinner
      - Reading
      - Movie Time
      - Game Night
      - DOG TV
      - Chill
    initial: "Off"

input_boolean:
  homehub_media_remote_drawer_open:
    name: HomeHub Media Remote Drawer Open
    icon: mdi:remote-tv

  homehub_media_quiet_mode:
    name: HomeHub Media Quiet Mode
    icon: mdi:volume-low

  homehub_media_blocked_by_night:
    name: HomeHub Media Blocked by Night Mode
    icon: mdi:weather-night

  # Runtime-only mode flag. It deliberately resets to OFF after HA startup
  # because the dynamic pre-Fireplace snapshot scenes are also runtime-only.
  homehub_media_fireplace_active:
    name: HomeHub Media Fireplace Active
    icon: mdi:fireplace
    initial: false

  # Runtime-only room-modifier flag. Movie Time is a one-shot scene: it applies
  # its room changes once, never re-enforces them, and restores the pre-mode
  # snapshots only when Movie Time is explicitly ended or another ambience mode
  # takes ownership.
  homehub_media_movie_time_active:
    name: HomeHub Media Movie Time Active
    icon: mdi:movie-open
    initial: false

  # Runtime ownership for the glare shutter. Scene existence is deliberately
  # not used as authority because a stale runtime scene must never close or
  # restore the shutter during a later Movie Time activation.
  homehub_media_movie_time_shutter_owned:
    name: HomeHub Media Movie Time Shutter Owned
    icon: mdi:window-shutter-alert
    initial: false

  # Runtime-only authority for Dinner, Reading, Game Night and Chill. All four
  # are one-shot room modifiers and share one set of dynamic restore scenes.
  homehub_media_room_scene_active:
    name: HomeHub Media Room Scene Active
    icon: mdi:lightbulb-group-outline
    initial: false

  # App subscription/availability switches.
  # No initial value is set so Home Assistant restores the last selected state.
  # On first creation a helper may start off; hold its dashboard tile to enable it.
  homehub_media_app_netflix_enabled:
    name: HomeHub Media App Netflix Enabled
    icon: mdi:netflix

  homehub_media_app_amazon_prime_enabled:
    name: HomeHub Media App Amazon Prime Enabled
    icon: mdi:amazon

  homehub_media_app_partner_tv_enabled:
    name: HomeHub Media App Partner TV Enabled
    icon: mdi:television

  homehub_media_app_disney_plus_enabled:
    name: HomeHub Media App Disney Plus Enabled
    icon: mdi:castle

  homehub_media_app_apple_tv_enabled:
    name: HomeHub Media App Apple TV Enabled
    icon: mdi:apple

  homehub_media_app_hbo_max_enabled:
    name: HomeHub Media App HBO Max Enabled
    icon: mdi:movie-open

input_text:
  # Proven ESP32 Wi-Fi -> BLE HID keyboard bridge. The host helper is retained
  # so the bridge can move from mDNS to a reserved IP later without rewriting
  # scripts. The text helper is a Developer Tools fallback; the dashboard's
  # compact keyboard field submits browser-local text directly to the script.
  homehub_media_keyboard_host:
    name: HomeHub Media Keyboard Host
    icon: mdi:access-point-network
    max: 64
    mode: text
    initial: YOUR_MEDIA_KEYBOARD_HOST

  homehub_media_keyboard_text:
    name: HomeHub Media Keyboard Text
    icon: mdi:keyboard-outline
    max: 100
    mode: text
    initial: ""

  homehub_media_partner_channel_buffer:
    name: HomeHub Media Partner Channel Buffer
    icon: mdi:dialpad
    max: 3
    pattern: "[0-9]*"
    mode: text
    initial: ""

input_number:
  homehub_media_normal_volume:
    name: HomeHub Media Normal Volume
    icon: mdi:volume-medium
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    initial: 19

  homehub_media_quiet_volume:
    name: HomeHub Media Quiet Volume
    icon: mdi:volume-low
    min: 0
    max: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    initial: 10

  # Legacy Fireplace level helper retained for compatibility with existing UI/
  # history. v3.0 no longer uses it for the light engine.
  homehub_media_fireplace_level:
    name: HomeHub Media Fireplace Level
    icon: mdi:fire
    min: 5
    max: 95
    step: 1
    mode: slider
    initial: 55

template:
  - sensor:
      - name: HomeHub Media Status
        unique_id: homehub_media_status
        icon: >-
          {% set phase = states('input_select.homehub_media_phase') %}
          {% set requested = states('input_select.homehub_media_requested_activity') %}
          {% if phase == 'Blocked' %}
            mdi:weather-night
          {% elif phase == 'Needs reset' %}
            mdi:alert-circle-outline
          {% elif phase == 'Transitioning' %}
            mdi:progress-clock
          {% elif requested == 'Off' %}
            mdi:television-off
          {% elif requested == 'Partner TV' %}
            mdi:television-box
          {% else %}
            mdi:apps
          {% endif %}
        state: >-
          {% set phase = states('input_select.homehub_media_phase') %}
          {% set requested = states('input_select.homehub_media_requested_activity') %}
          {% set quiet = is_state('input_boolean.homehub_media_quiet_mode', 'on') %}
          {% if phase == 'Blocked' %}
            Night Mode · media blocked
          {% elif phase == 'Transitioning' %}
            Starting {{ requested }}…
          {% elif phase == 'Needs reset' %}
            Needs reset · {{ requested }}
          {% elif requested == 'Off' %}
            Off
          {% elif quiet %}
            {{ requested }} · Quiet
          {% else %}
            {{ requested }}
          {% endif %}
        attributes:
          requested_activity: >-
            {{ states('input_select.homehub_media_requested_activity') }}
          phase: >-
            {{ states('input_select.homehub_media_phase') }}
          quiet_mode: >-
            {{ is_state('input_boolean.homehub_media_quiet_mode', 'on') }}
          tv_state: >-
            {{ states('media_player.your_primary_tv') }}
          local_tv_state: >-
            {{ states('media_player.your_samsung_tv') }}
          tv_reported_source: >-
            {{ state_attr('media_player.your_primary_tv', 'source')
               | default('unknown', true) }}
          samsung_reported_app: >-
            {{ states('sensor.your_primary_tv_channel_name')
               | default('unknown', true) }}
          observed_app: >-
            {{ states('sensor.homehub_media_observed_app') }}
          samsung_source_list: >-
            {{ state_attr('media_player.your_samsung_tv', 'source_list')
               | default([], true) }}
          partner_state: >-
            {{ states('media_player.your_streaming_box') }}
          partner_reported_app: >-
            {{ state_attr('media_player.your_streaming_box', 'app_id') | default('unknown', true) }}
          note: >-
            Requested activity is intentional state. HomeHub Media Observed App is independently derived from the TV's native SmartThings foreground-app report.

      - name: HomeHub Media Observed App
        unique_id: homehub_media_observed_app
        icon: mdi:television-play
        state: >-
          {% set tv = states('media_player.your_primary_tv') %}
          {% set off_states = ['off', 'unavailable', 'unknown', 'none'] %}
          {% set source = state_attr('media_player.your_primary_tv', 'source')
             | default('', true) | string | lower %}
          {% set native_raw = states('sensor.your_primary_tv_channel_name') %}
          {% set smart_raw = state_attr('media_player.your_samsung_tv', 'media_title')
             | default('', true) | string %}
          {% set bad = ['', 'unknown', 'unavailable', 'none', 'None'] %}
          {% set raw = native_raw if native_raw not in bad else smart_raw %}
          {% set app_map = {
            'org.tizen.netflix-app': 'Netflix',
            'org.tizen.primevideo': 'Amazon Prime',
            'Di0N6xZMEA.disneyplus': 'Disney+',
            'com.samsung.tv.aria-video': 'Apple TV',
            '5b8c3eb16b.BeamCTVDev': 'HBO Max',
            '9Ur5IzDKqV.TizenYouTube': 'YouTube'
          } %}
          {% if tv in off_states %}
            Off
          {% elif source in ['hdmi1', 'hdmi 1', 'hdmi_1'] %}
            Partner TV
          {% elif raw in app_map %}
            {{ app_map[raw] }}
          {% else %}
            Samsung TV
          {% endif %}
        attributes:
          raw_app_id: >-
            {% set native_raw = states('sensor.your_primary_tv_channel_name') %}
            {% set smart_raw = state_attr('media_player.your_samsung_tv', 'media_title')
               | default('', true) | string %}
            {% set bad = ['', 'unknown', 'unavailable', 'none', 'None'] %}
            {{ native_raw if native_raw not in bad else smart_raw }}
          observation_source: >-
            {% set native_raw = states('sensor.your_primary_tv_channel_name') %}
            {% if native_raw not in ['', 'unknown', 'unavailable', 'none', 'None'] %}
              Native SmartThings
            {% else %}
              SamsungTV Smart fallback
            {% endif %}
          smartthings_source: >-
            {{ state_attr('media_player.your_primary_tv', 'source')
               | default('unknown', true) }}
          samsungtv_smart_media_title: >-
            {{ state_attr('media_player.your_samsung_tv', 'media_title')
               | default('unknown', true) }}
          keyboard_support: >-
            {% set raw = states('sensor.your_primary_tv_channel_name') %}
            {% if raw in ['org.tizen.netflix-app', 'com.samsung.tv.aria-video', '9Ur5IzDKqV.TizenYouTube'] %}
              supported
            {% elif raw == '5b8c3eb16b.BeamCTVDev' %}
              limited
            {% else %}
              unsupported
            {% endif %}
          keyboard_available: >-
            {% set raw = states('sensor.your_primary_tv_channel_name') %}
            {{ raw in [
              'org.tizen.netflix-app',
              'com.samsung.tv.aria-video',
              '9Ur5IzDKqV.TizenYouTube',
              '5b8c3eb16b.BeamCTVDev'
            ] }}
          keyboard_note: >-
            Netflix, YouTube and Apple TV are proven. HBO Max is usable but unreliable because its Samsung app drops physical-HID characters. Prime Video and Disney+ reject keyboard text.

      - name: HomeHub Media Observed State
        unique_id: homehub_media_observed_state
        icon: mdi:eye-outline
        state: >-
          {% set tv = states('media_player.your_primary_tv') %}
          {% set partner = states('media_player.your_streaming_box') %}
          {% set off_states = ['off', 'unavailable', 'unknown', 'none'] %}
          {% set tv_powered = tv not in off_states %}
          {% set partner_powered = partner not in off_states %}
          {% if not tv_powered and not partner_powered %}
            Off
          {% elif tv_powered and partner_powered %}
            TV and Partner powered
          {% elif tv_powered %}
            TV powered
          {% elif partner_powered %}
            Partner powered · TV not confirmed
          {% else %}
            Unknown
          {% endif %}
        attributes:
          tv_state: "{{ states('media_player.your_primary_tv') }}"
          local_tv_state: "{{ states('media_player.your_samsung_tv') }}"
          partner_state: "{{ states('media_player.your_streaming_box') }}"
          limitation: >-
            The foreground Samsung app is now observed independently; exact in-app page/content and Partner+ channel remain unverified.

# -----------------------------------------------------------------------------
# Samsung TV local application REST API
#
# SamsungTV Smart itself uses this same endpoint family internally.
# The URL is templated so the script passes the TV host and app ID explicitly.
# -----------------------------------------------------------------------------
rest_command:
  homehub_media_hub_open_backend:
    url: "http://YOUR_UBUNTU_HOST_IP:8098/v1/open"
    method: POST
    content_type: "application/json"
    payload: "{}"
    timeout: 20

  homehub_media_hub_open_mode_backend:
    url: "http://YOUR_UBUNTU_HOST_IP:8098/v1/open/{{ mode }}"
    method: POST
    content_type: "application/json"
    payload: "{}"
    timeout: 20

  homehub_media_hub_close_backend:
    url: "http://YOUR_UBUNTU_HOST_IP:8098/v1/close"
    method: POST
    content_type: "application/json"
    payload: "{}"
    timeout: 20

  homehub_media_hub_remote_backend:
    url: "http://YOUR_UBUNTU_HOST_IP:8098/v1/remote/{{ command }}"
    method: POST
    content_type: "application/json"
    payload: "{}"
    timeout: 10

  homehub_media_samsung_app_status:
    url: "http://{{ host }}:8001/api/v2/applications/{{ app_id }}"
    method: get
    timeout: 5

  homehub_media_samsung_app_close:
    url: "http://{{ host }}:8001/api/v2/applications/{{ app_id }}"
    method: delete
    timeout: 5

  homehub_media_samsung_app_run:
    url: "http://{{ host }}:8001/api/v2/applications/{{ app_id }}"
    method: post
    timeout: 5

  homehub_media_keyboard_http_type:
    url: >-
      http://{{ states('input_text.homehub_media_keyboard_host') }}/type
    method: post
    headers:
      X-HomeHub-Key: "YOUR_MEDIA_KEYBOARD_SHARED_SECRET"
    content_type: text/plain
    payload: "{{ text }}"
    timeout: 15

  homehub_media_keyboard_http_key:
    url: >-
      http://{{ states('input_text.homehub_media_keyboard_host') }}/key
    method: post
    headers:
      X-HomeHub-Key: "YOUR_MEDIA_KEYBOARD_SHARED_SECRET"
    content_type: text/plain
    payload: "{{ key }}"
    timeout: 15

script:
  homehub_media_hub_open:
    alias: HomeHub Media Hub · Open
    description: Stops Ambience, starts the dedicated client, then selects HDMI3.
    icon: mdi:television-play
    mode: single
    sequence:
      - action: rest_command.homehub_media_hub_open_backend
        response_variable: media_hub_open_response
      - if:
          - condition: template
            value_template: >-
              {{ media_hub_open_response.status | default(0) | int == 200 }}
        then:
          - action: script.homehub_media_select_pc_source
        else:
          - stop: "Media Hub backend did not confirm open"
            error: true

  homehub_media_hub_close:
    alias: HomeHub Media Hub · Close
    description: Stops only the dedicated Media Hub client; does not resume Ambience.
    icon: mdi:close-box
    mode: single
    sequence:
      - action: rest_command.homehub_media_hub_close_backend
        response_variable: media_hub_close_response
      - if:
          - condition: template
            value_template: >-
              {{ media_hub_close_response.status | default(0) | int != 200 }}
        then:
          - stop: "Media Hub backend did not confirm close"
            error: true

  homehub_media_hub_exit_to_partner:
    alias: HomeHub Media Hub · Exit to Partner TV
    description: Stops the Media Hub client and returns the TV to Partner HDMI1.
    icon: mdi:television-box
    mode: single
    sequence:
      - action: rest_command.homehub_media_hub_close_backend
        response_variable: media_hub_close_response
      - if:
          - condition: template
            value_template: >-
              {{ media_hub_close_response.status | default(0) | int == 200 }}
        then:
          - action: script.homehub_media_select_partner_source
        else:
          - stop: "Media Hub backend did not confirm close"
            error: true

  homehub_media_hub_remote:
    alias: HomeHub Media Hub · Remote Command
    description: Sends one allowlisted command to the active dedicated Firefox client.
    icon: mdi:remote
    mode: queued
    max: 20
    fields:
      command:
        name: Command
        required: true
        selector:
          select:
            options:
              - up
              - down
              - left
              - right
              - tab
              - select
              - back
              - play_pause
              - stop
              - home
    sequence:
      - variables:
          requested_command: "{{ command | string }}"
          allowed_commands:
            - up
            - down
            - left
            - right
            - tab
            - select
            - back
            - play_pause
            - stop
            - home
      - if:
          - condition: template
            value_template: "{{ requested_command not in allowed_commands }}"
        then:
          - stop: "Unsupported Media Hub remote command"
            error: true
      - action: rest_command.homehub_media_hub_remote_backend
        data:
          command: "{{ requested_command }}"

  homehub_media_hub_up:
    alias: HomeHub Media Hub · Up
    mode: queued
    sequence:
      - action: script.homehub_media_hub_remote
        data: {command: up}

  homehub_media_hub_down:
    alias: HomeHub Media Hub · Down
    mode: queued
    sequence:
      - action: script.homehub_media_hub_remote
        data: {command: down}

  homehub_media_hub_left:
    alias: HomeHub Media Hub · Left
    mode: queued
    sequence:
      - action: script.homehub_media_hub_remote
        data: {command: left}

  homehub_media_hub_right:
    alias: HomeHub Media Hub · Right
    mode: queued
    sequence:
      - action: script.homehub_media_hub_remote
        data: {command: right}

  homehub_media_hub_select:
    alias: HomeHub Media Hub · Select
    mode: queued
    sequence:
      - action: script.homehub_media_hub_remote
        data: {command: select}

  homehub_media_hub_back:
    alias: HomeHub Media Hub · Back
    mode: queued
    sequence:
      - action: script.homehub_media_hub_remote
        data: {command: back}

  homehub_media_hub_play_pause:
    alias: HomeHub Media Hub · Play/Pause
    mode: queued
    sequence:
      - action: script.homehub_media_hub_remote
        data: {command: play_pause}

  homehub_media_hub_stop:
    alias: HomeHub Media Hub · Stop
    mode: queued
    sequence:
      - action: script.homehub_media_hub_remote
        data: {command: stop}

  homehub_media_hub_home:
    alias: HomeHub Media Hub · Home
    mode: queued
    sequence:
      - action: script.homehub_media_hub_remote
        data: {command: home}
  # -------------------------------------------------------------------------
  # Samsung TV keyboard bridge
  #
  # Proven path:
  # Home Assistant -> Wi-Fi HTTP -> ESP32 v0.2.4 -> BLE HID -> Samsung TV.
  # UI text is browser-local and arrives through the script field. The helper
  # remains as a Developer Tools fallback.
  # -------------------------------------------------------------------------
  homehub_media_keyboard_type:
    alias: HomeHub Media · Samsung Keyboard · Type
    description: Types English text through the proven ESP32 BLE HID bridge without pressing Enter.
    icon: mdi:keyboard-outline
    mode: queued
    max: 5
    fields:
      text:
        name: Text
        required: false
        selector:
          text:
    sequence:
      - variables:
          outgoing_text: >-
            {{ text if text is defined and (text | string | length) > 0
               else states('input_text.homehub_media_keyboard_text') }}
          observed_app: "{{ states('sensor.homehub_media_observed_app') }}"
      - condition: template
        value_template: >-
          {{ 0 < (outgoing_text | string | length) <= 100 }}
      - condition: template
        value_template: >-
          {{ observed_app in ['Netflix', 'YouTube', 'Apple TV', 'HBO Max'] }}
      - action: rest_command.homehub_media_keyboard_http_type
        data:
          text: "{{ outgoing_text }}"

  homehub_media_keyboard_submit:
    alias: HomeHub Media · Samsung Keyboard · Submit Text
    description: >-
      Submits the browser text through the exact proven HomeHub keyboard type
      path. Pressing Enter in the Home Hub field means "send this text"; it
      does not send a second BLE Enter key to the TV. This intentionally matches
      the successful Developer Tools /type test and avoids an extra HID event at
      the end of the string.
    icon: mdi:keyboard-return
    mode: queued
    max: 5
    fields:
      text:
        name: Text
        required: true
        selector:
          text:
    sequence:
      - action: script.homehub_media_keyboard_type
        data:
          text: "{{ text | default('', true) | string }}"

  homehub_media_keyboard_backspace:
    alias: HomeHub Media · Samsung Keyboard · Backspace
    icon: mdi:backspace-outline
    mode: queued
    max: 5
    sequence:
      - action: rest_command.homehub_media_keyboard_http_key
        data:
          key: backspace

  homehub_media_keyboard_enter:
    alias: HomeHub Media · Samsung Keyboard · Enter
    icon: mdi:keyboard-return
    mode: queued
    max: 5
    sequence:
      - action: rest_command.homehub_media_keyboard_http_key
        data:
          key: enter

  homehub_media_keyboard_clear:
    alias: HomeHub Media · Samsung Keyboard · Clear
    icon: mdi:close-box-outline
    mode: single
    sequence:
      - action: rest_command.homehub_media_keyboard_http_key
        data:
          key: clear

  homehub_media_select_partner_source:
    alias: HomeHub Media · Select Partner Source
    description: >-
      Internal one-shot HDMI1 command. The dispatcher starts this helper with
      script.turn_on so a temporary SmartThings ConflictError remains isolated
      and cannot abort the complete Partner TV activity.
    icon: mdi:video-input-hdmi
    mode: restart
    max_exceeded: silent
    sequence:
      - action: media_player.select_source
        target:
          entity_id: media_player.your_primary_tv
        data:
          source: hdmi1

  homehub_media_select_pc_source:
    alias: HomeHub Media · Select PC Source
    description: >-
      Selects the PC directly on HDMI3 using SamsungTV Smart's proven discrete
      ST_HDMI3 command. SmartThings does not expose/recognize HDMI3 reliably,
      so this helper deliberately does not require source=hdmi3 verification.
    icon: mdi:monitor
    mode: restart
    max_exceeded: silent
    sequence:
      - variables:
          tv_was_cold: >-
            {{ states('media_player.your_primary_tv') in
               ['off', 'unavailable', 'unknown', 'none'] }}

      - if:
          - condition: template
            value_template: "{{ tv_was_cold }}"
        then:
          - action: media_player.turn_on
            continue_on_error: true
            target:
              entity_id: media_player.your_primary_tv

          - wait_template: >-
              {{ states('media_player.your_primary_tv') not in
                 ['off', 'unavailable', 'unknown', 'none'] }}
            timeout: "00:00:06"
            continue_on_timeout: true

          - delay:
              seconds: 3

      # ST_HDMI3 was live-tested successfully. Do not verify it against the
      # SmartThings source attribute because that entity does not expose HDMI3.
      - action: media_player.play_media
        continue_on_error: true
        target:
          entity_id: media_player.your_samsung_tv
        data:
          media_content_type: send_key
          media_content_id: ST_HDMI3

      # Give Tizen/HDMI switching a short moment before the Ubuntu player starts.
      - delay:
          milliseconds: 1200

  homehub_media_apply_volume:
    alias: HomeHub Media · Apply Volume Policy
    description: Applies the current Normal or Quiet TV-speaker volume.
    icon: mdi:volume-medium
    mode: restart
    sequence:
