  # -------------------------------------------------------------------------
  # DOG TV mode toggle
  # -------------------------------------------------------------------------
  homehub_media_ambience_dog_tv:
    alias: HomeHub Media · Ambience · DOG TV
    description: Toggles DOG TV; a second press stops the mode and returns Samsung to Home.
    icon: mdi:dog
    mode: restart
    max_exceeded: silent
    sequence:
      - if:
          - condition: state
            entity_id: input_boolean.homehub_night_mode
            state: "on"
          - condition: template
            value_template: >-
              {{ not is_state('input_select.homehub_media_ambience_mode', 'DOG TV') }}
        then:
          - action: input_boolean.turn_on
            continue_on_error: true
            target:
              entity_id: input_boolean.homehub_media_blocked_by_night
          - stop: "Night Mode is active; DOG TV start was blocked"

      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.homehub_media_ambience_mode
                state: DOG TV
            sequence:
              - action: script.homehub_media_ambience_return_home
        default:
          # Any active Movie Time room scene is restored before DOG TV takes
          # ownership of the Ambience selector.
          - if:
              - condition: state
                entity_id: input_boolean.homehub_media_movie_time_active
                state: "on"
            then:
              - action: script.homehub_media_movie_time_stop
                continue_on_error: true

          - if:
              - condition: state
                entity_id: input_boolean.homehub_media_room_scene_active
                state: "on"
            then:
              - action: script.homehub_media_room_scene_stop
                continue_on_error: true

          # If Fireplace owned the lights, restore them before DOG TV takes over.
          - if:
              - condition: state
                entity_id: input_boolean.homehub_media_fireplace_active
                state: "on"
            then:
              - action: script.homehub_media_fireplace_stop
                continue_on_error: true

          - action: input_select.select_option
            target:
              entity_id: input_select.homehub_media_ambience_mode
            data:
              option: DOG TV

          - action: script.homehub_ambient_host_dog_tv
            continue_on_error: true

