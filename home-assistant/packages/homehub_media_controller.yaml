              - condition: template
                value_template: "{{ requested_room_mode == 'Dinner' }}"
            sequence:
              - parallel:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.your_primary_room_light
                    data:
                      brightness_pct: 20
                      color_temp_kelvin: 2702
                      transition: 1.5
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.your_accent_light
                    data:
                      brightness_pct: 25
                      color_temp_kelvin: 2200
                      transition: 1.5
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.your_kitchen_island
                    data:
                      brightness_pct: 60
                      color_temp_kelvin: 2400
                      transition: 1.5
                  - action: light.turn_off
                    continue_on_error: true
                    target:
                      entity_id: light.your_kitchen_ceiling
                    data:
                      transition: 1.5
                  - sequence:
