            error: true


automation:
  - id: homehub_media_quiet_volume_policy
    alias: HomeHub Media · Quiet Volume Policy
    description: Applies the selected Normal/Quiet volume whenever the modifier changes.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.homehub_media_quiet_mode
    conditions:
      - condition: template
        value_template: >-
          {{ states('media_player.your_samsung_tv') not in
             ['off', 'unavailable', 'unknown', 'none'] }}
    actions:
      - action: script.homehub_media_apply_volume

  - id: homehub_media_night_mode_authority
    alias: HomeHub Media · Night Mode Authority
    description: >-
      Night Mode cancels any media transition and requests Off. When Night Mode
      ends, the controller remains Off until a person requests a new activity.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.homehub_night_mode
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.homehub_night_mode
                state: "on"
            sequence:
              - action: script.homehub_media_set_activity
                data:
                  activity: "Off"
                  force_recovery: false
        default:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.homehub_media_blocked_by_night
          - if:
              - condition: state
                entity_id: input_select.homehub_media_phase
                state: Blocked
            then:
              - action: input_select.select_option
                target:
                  entity_id: input_select.homehub_media_phase
                data:
                  option: Ready
