                    data:
                      brightness_pct: 85
                      color_temp_kelvin: 4000
                      transition: 1.2
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.your_accent_light
                    data:
                      brightness_pct: 65
                      color_temp_kelvin: 3800
                      transition: 1.2
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.your_kitchen_island
                    data:
                      brightness_pct: 40
                      color_temp_kelvin: 3500
                      transition: 1.2
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.your_kitchen_ceiling
                    data:
                      brightness_pct: 25
                      color_temp_kelvin: 3500
                      transition: 1.2
                  - action: light.turn_off
                    continue_on_error: true
                    target:
                      entity_id: light.your_mood_lights

          - conditions:
              - condition: template
                value_template: "{{ requested_room_mode == 'Game Night' }}"
            sequence:
              - parallel:
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.your_primary_room_light
                    data:
                      brightness_pct: 90
                      color_temp_kelvin: 4000
                      transition: 1.2
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.your_accent_light
                    data:
                      brightness_pct: 22
                      hs_color: [210, 45]
                      transition: 1.2
                  - action: light.turn_on
                    continue_on_error: true
                    target:
                      entity_id: light.your_kitchen_island
                    data:
                      brightness_pct: 25
                      color_temp_kelvin: 3000
                      transition: 1.2
                  - action: light.turn_off
                    continue_on_error: true
                    target:
                      entity_id: light.your_kitchen_ceiling
                    data:
                      transition: 1.2
                  - sequence:
                      - action: light.turn_on
                        continue_on_error: true
                        target:
                          entity_id: light.your_mood_lights
                      - action: light.turn_on
                        continue_on_error: true
                        target:
                          entity_id: light.your_light_strip
