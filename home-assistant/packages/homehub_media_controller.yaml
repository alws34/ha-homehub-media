        target:
          entity_id: input_boolean.homehub_media_room_scene_active

      - action: input_select.select_option
        continue_on_error: true
        target:
          entity_id: input_select.homehub_media_ambience_mode
        data:
          option: "Off"

      - parallel:
          - sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states.scene.homehub_room_scene_restore_primary_room is defined }}
                then:
                  - action: scene.turn_on
                    continue_on_error: true
                    target:
                      entity_id: scene.homehub_room_scene_restore_primary_room

          - sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states.scene.homehub_room_scene_restore_accent_light is defined }}
                then:
                  - action: scene.turn_on
                    continue_on_error: true
                    target:
                      entity_id: scene.homehub_room_scene_restore_accent_light

          - sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states.scene.homehub_room_scene_restore_island is defined }}
                then:
                  - action: scene.turn_on
                    continue_on_error: true
                    target:
                      entity_id: scene.homehub_room_scene_restore_island

          - sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states.scene.homehub_room_scene_restore_kitchen_ceiling_light is defined }}
                then:
                  - action: scene.turn_on
                    continue_on_error: true
                    target:
                      entity_id: scene.homehub_room_scene_restore_kitchen_ceiling_light

          - sequence:
              - if:
                  - condition: template
                    value_template: >-
                      {{ states.scene.homehub_room_scene_restore_mood is defined }}
                then:
                  - action: scene.turn_on
                    continue_on_error: true
                    target:
                      entity_id: scene.homehub_room_scene_restore_mood

  homehub_media_room_scene_apply_preset:
