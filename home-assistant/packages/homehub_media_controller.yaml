                          entity_id: light.your_light_strip
                        data:
                          brightness_pct: 10
                          effect: breathe

  homehub_media_room_scene_toggle:
    alias: HomeHub Media · Room Scene · Toggle
    description: Shared dynamic snapshot and one-shot scene controller for the four non-TV ambience modes.
    icon: mdi:lightbulb-group-outline
    mode: restart
    max_exceeded: silent
    fields:
      room_mode:
        name: Room mode
        required: true
        selector:
          select:
            options:
              - Dinner
              - Reading
              - Game Night
              - Chill
      apply_lighting:
        name: Apply lighting preset
        description: When false, create/preserve the room restore snapshot and activate the mode without changing the lights.
        required: false
        default: true
        selector:
          boolean:
    sequence:
      - variables:
          requested_room_mode: "{{ room_mode | default('', true) }}"

      - if:
          - condition: template
            value_template: >-
              {{ requested_room_mode not in ['Dinner', 'Reading', 'Game Night', 'Chill'] }}
        then:
          - stop: "Unsupported HomeHub room scene"

      - choose:
          # Second press restores the room and deliberately leaves TV/media alone.
          - conditions:
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.homehub_media_room_scene_active', 'on')
                     and is_state('input_select.homehub_media_ambience_mode', requested_room_mode) }}
            sequence:
              - action: script.homehub_media_room_scene_stop

        default:
          - if:
              - condition: state
                entity_id: input_boolean.homehub_night_mode
                state: "on"
            then:
              - action: input_boolean.turn_on
                continue_on_error: true
                target:
                  entity_id: input_boolean.homehub_media_blocked_by_night
              - stop: "Night Mode is active; room scene start was blocked"

          - if:
              - condition: state
                entity_id: input_boolean.homehub_media_movie_time_active
                state: "on"
            then:
              - action: script.homehub_media_movie_time_stop
                continue_on_error: true

          - if:
              - condition: state
                entity_id: input_boolean.homehub_media_room_scene_active
                state: "on"
            then:
              - action: script.homehub_media_room_scene_stop
                continue_on_error: true

          # Fireplace and DOG TV own the TV; use their common stop/Home path.
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.homehub_media_fireplace_active', 'on')
                     or is_state('input_select.homehub_media_ambience_mode', 'DOG TV') }}
            then:
              - action: script.homehub_media_ambience_return_home
                continue_on_error: true

          - repeat:
              for_each:
                - scene.homehub_room_scene_restore_primary_room
                - scene.homehub_room_scene_restore_accent_light
                - scene.homehub_room_scene_restore_island
                - scene.homehub_room_scene_restore_kitchen_ceiling_light
                - scene.homehub_room_scene_restore_mood
              sequence:
                - if:
                    - condition: template
                      value_template: >-
                        {{ states(repeat.item) not in ['unknown', 'unavailable'] }}
                  then:
                    - action: scene.delete
                      continue_on_error: true
                      data:
                        entity_id: "{{ repeat.item }}"

          - if:
              - condition: template
                value_template: >-
                  {{ states('light.your_primary_room_light') not in ['unavailable', 'unknown', 'none'] }}
            then:
              - action: scene.create
                continue_on_error: true
                data:
                  scene_id: homehub_room_scene_restore_primary_room
                  snapshot_entities: >-
                    {% set members = state_attr('light.your_primary_room_light', 'entity_id') or [] %}
                    {% set candidates = (members | list) if (members | list | count) > 0 else ['light.your_primary_room_light'] %}
                    {% set ns = namespace(entities=[]) %}
                    {% for item in candidates %}
                      {% if states(item) not in ['unavailable', 'unknown', 'none'] %}
                        {% set ns.entities = ns.entities + [item] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.entities }}

          - if:
              - condition: template
                value_template: >-
                  {{ states('light.your_accent_light') not in ['unavailable', 'unknown', 'none'] }}
            then:
              - action: scene.create
                continue_on_error: true
                data:
                  scene_id: homehub_room_scene_restore_accent_light
                  snapshot_entities: >-
                    {% set members = state_attr('light.your_accent_light', 'entity_id') or [] %}
                    {% set candidates = (members | list) if (members | list | count) > 0 else ['light.your_accent_light'] %}
                    {% set ns = namespace(entities=[]) %}
                    {% for item in candidates %}
                      {% if states(item) not in ['unavailable', 'unknown', 'none'] %}
                        {% set ns.entities = ns.entities + [item] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.entities }}

          - if:
              - condition: template
                value_template: >-
                  {{ states('light.your_kitchen_island') not in ['unavailable', 'unknown', 'none'] }}
            then:
              - action: scene.create
                continue_on_error: true
                data:
                  scene_id: homehub_room_scene_restore_island
                  snapshot_entities: >-
                    {% set members = state_attr('light.your_kitchen_island', 'entity_id') or [] %}
                    {% set candidates = (members | list) if (members | list | count) > 0 else ['light.your_kitchen_island'] %}
                    {% set ns = namespace(entities=[]) %}
                    {% for item in candidates %}
                      {% if states(item) not in ['unavailable', 'unknown', 'none'] %}
                        {% set ns.entities = ns.entities + [item] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.entities }}

          - if:
              - condition: template
                value_template: >-
                  {{ states('light.your_kitchen_ceiling') not in ['unavailable', 'unknown', 'none'] }}
            then:
              - action: scene.create
                continue_on_error: true
                data:
                  scene_id: homehub_room_scene_restore_kitchen_ceiling_light
                  snapshot_entities:
                    - light.your_kitchen_ceiling

          - if:
              - condition: template
                value_template: >-
                  {{ states('light.your_mood_lights') not in ['unavailable', 'unknown', 'none']
                     or states('light.your_light_strip') not in ['unavailable', 'unknown', 'none'] }}
            then:
              - action: scene.create
                continue_on_error: true
                data:
                  scene_id: homehub_room_scene_restore_mood
                  snapshot_entities: >-
                    {% set members = state_attr('light.your_mood_lights', 'entity_id') or [] %}
                    {% set candidates = ((members | list) + ['light.your_light_strip']) | unique | list %}
                    {% set ns = namespace(entities=[]) %}
                    {% for item in candidates %}
                      {% if states(item) not in ['unavailable', 'unknown', 'none'] %}
                        {% set ns.entities = ns.entities + [item] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.entities }}

          - action: input_select.select_option
            target:
              entity_id: input_select.homehub_media_ambience_mode
            data:
              option: "{{ requested_room_mode }}"

          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.homehub_media_room_scene_active

          # One-shot application. Later manual changes are respected until stop.
          # The UI may suppress this at initial mode start while still preserving
          # the room snapshot and active-mode state.
          - if:
              - condition: template
                value_template: "{{ apply_lighting | default(true) | bool }}"
            then:
              - action: script.homehub_media_room_scene_apply_preset
                data:
                  room_mode: "{{ requested_room_mode }}"

  homehub_media_ambience_dinner:
    alias: HomeHub Media · Ambience · Dinner
    icon: mdi:glass-wine
    mode: restart
    fields:
      skip_media:
