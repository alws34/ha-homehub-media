# Home Hub Media Hub PC keyboard and pointer controller v0.2
# Intended destination: /homeassistant/packages/homehub_media_hub_pc_keyboard.yaml
# Ubuntu HDMI Sonarr/Radarr/Jellyfin browser only.
# Replace YOUR_UBUNTU_HOST_IP with the Ubuntu PC's LAN address before use.
# This does not use or modify the ESP32/BLE Samsung TV keyboard bridge or Partner-TV UI.

input_text:
  homehub_media_hub_pc_keyboard_text:
    name: HomeHub Media Hub PC Keyboard Text
    icon: mdi:keyboard-outline
    max: 100
    mode: text
    initial: ""

rest_command:
  homehub_media_hub_pc_keyboard_text:
    url: "http://YOUR_UBUNTU_HOST_IP:8098/v1/keyboard/text"
    method: POST
    content_type: "application/json"
    payload: >-
      {{ {'text': text | string, 'submit': submit | default(false) | bool} | tojson }}
    timeout: 15

  homehub_media_hub_pc_keyboard_key:
    url: "http://YOUR_UBUNTU_HOST_IP:8098/v1/remote/{{ key }}"
    method: POST
    content_type: "application/json"
    payload: "{}"
    timeout: 10

  # HA calls the allowlisted Ubuntu coordinator, which injects constrained
  # relative pointer events into the active Media Hub browser.
  homehub_media_hub_pointer_move:
    url: "http://YOUR_UBUNTU_HOST_IP:8098/v1/pointer/move"
    method: POST
    content_type: "application/json"
    payload: >-
      {{ {'dx': dx | float(0), 'dy': dy | float(0)} | tojson }}
    timeout: 10

  homehub_media_hub_pointer_click:
    url: "http://YOUR_UBUNTU_HOST_IP:8098/v1/pointer/click"
    method: POST
    content_type: "application/json"
    payload: >-
      {{ {'button': button | string} | tojson }}
    timeout: 10

  homehub_media_hub_pointer_scroll:
    url: "http://YOUR_UBUNTU_HOST_IP:8098/v1/pointer/scroll"
    method: POST
    content_type: "application/json"
    payload: >-
      {{ {'dy': dy | float(0)} | tojson }}
    timeout: 10

script:
  homehub_media_hub_pc_keyboard_type:
    alias: HomeHub Media Hub · PC Keyboard · Type
    description: Types text into the active Ubuntu Media Hub browser window.
    icon: mdi:keyboard-outline
    mode: queued
    max: 5
    fields:
      text:
        name: Text
        required: false
        selector:
          text:
    sequence:
      - variables:
          outgoing_text: >-
            {{ text if text is defined and (text | string | length) > 0
               else states('input_text.homehub_media_hub_pc_keyboard_text') }}
      - condition: template
        value_template: "{{ 0 < (outgoing_text | string | length) <= 100 }}"
      - action: rest_command.homehub_media_hub_pc_keyboard_text
        data:
          text: "{{ outgoing_text }}"
          submit: false

  homehub_media_hub_pc_keyboard_submit:
    alias: HomeHub Media Hub · PC Keyboard · Submit
    description: Types search text into Sonarr/Radarr and presses Enter.
    icon: mdi:keyboard-return
    mode: queued
    max: 5
    fields:
      text:
        name: Text
        required: false
        selector:
          text:
    sequence:
      - variables:
          outgoing_text: >-
            {{ text if text is defined and (text | string | length) > 0
               else states('input_text.homehub_media_hub_pc_keyboard_text') }}
      - condition: template
        value_template: "{{ 0 < (outgoing_text | string | length) <= 100 }}"
      - action: rest_command.homehub_media_hub_pc_keyboard_text
        data:
          text: "{{ outgoing_text }}"
          submit: true

  homehub_media_hub_pc_keyboard_backspace:
    alias: HomeHub Media Hub · PC Keyboard · Backspace
    icon: mdi:backspace-outline
    mode: queued
    max: 5
    sequence:
      - action: rest_command.homehub_media_hub_pc_keyboard_key
        data:
          key: backspace

  homehub_media_hub_pc_keyboard_enter:
    alias: HomeHub Media Hub · PC Keyboard · Enter
    icon: mdi:keyboard-return
    mode: queued
    max: 5
    sequence:
      - action: rest_command.homehub_media_hub_pc_keyboard_key
        data:
          key: enter

  homehub_media_hub_pc_keyboard_clear:
    alias: HomeHub Media Hub · PC Keyboard · Clear
    icon: mdi:close-box-outline
    mode: queued
    max: 5
    sequence:
      - action: rest_command.homehub_media_hub_pc_keyboard_key
        data:
          key: clear
