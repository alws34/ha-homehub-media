# Home Hub Ambient Player — additive Home Assistant bridge
# Version: 2.1.1 (2026-08-30)
# Intended destination: /homeassistant/packages/homehub_ambient_player.yaml
#
# Keeps every v1 entity used by the existing controller and adds the v2
# catalog, composition, profile, favorite, independent-layer, and partial
# live-update contract. TV source selection remains HA-owned. Host soundtrack-
# only playback selects HDMI3 because backend v2.1 presents a fullscreen safety
# still instead of exposing the Ubuntu desktop.

rest_command:
  # -----------------------------------------------------------------------
  # Compatibility routes retained for existing scripts.
  # -----------------------------------------------------------------------
  homehub_ambient_player_play:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v1/play/{{ scene }}"
    method: POST
    content_type: application/json
    timeout: 30

  homehub_ambient_player_stop:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/stop"
    method: POST
    content_type: application/json
    timeout: 15

  homehub_ambient_player_pause:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/pause"
    method: POST
    content_type: application/json
    timeout: 15

  homehub_ambient_player_resume:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/resume"
    method: POST
    content_type: application/json
    timeout: 15

  homehub_ambient_player_status:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/status"
    method: GET
    timeout: 10

  # -----------------------------------------------------------------------
  # v2 routes.
  # -----------------------------------------------------------------------
  homehub_ambient_player_catalog:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/catalog"
    method: GET
    timeout: 15

  homehub_ambient_player_catalog_refresh:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/catalog/refresh"
    method: POST
    content_type: application/json
    timeout: 60

  homehub_ambient_player_compose:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/play"
    method: POST
    content_type: application/json
    payload: "{{ body }}"
    timeout: 35

  homehub_ambient_player_state_patch:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/state"
    method: PATCH
    content_type: application/json
    payload: "{{ body }}"
    timeout: 35

  homehub_ambient_player_profile_get:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/profiles/{{ profile_id }}"
    method: GET
    timeout: 15

  homehub_ambient_player_profile_save:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/profiles/{{ profile_id }}"
    method: PUT
    content_type: application/json
    payload: "{{ body }}"
    timeout: 20

  homehub_ambient_player_profile_play:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/play-profile/{{ profile_id }}"
    method: POST
    content_type: application/json
    timeout: 35

  homehub_ambient_player_favorite:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/favorites/{{ media_kind }}/{{ media_id }}"
    method: PUT
    content_type: application/json
    payload: >-
      {{ {'favorite': favorite | bool} | to_json }}
    timeout: 20

  homehub_ambient_player_video_stop:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/video/stop"
    method: POST
    content_type: application/json
    timeout: 15

  homehub_ambient_player_soundtrack_stop:
    url: "http://YOUR_UBUNTU_HOST_IP:8097/v2/soundtrack/stop"
    method: POST
    content_type: application/json
    timeout: 15

script:
  # -----------------------------------------------------------------------
  # One-off composition. HDMI3 is required for a real visual or host audio.
  # Soundtrack-only mode is safe because backend v2.1 displays audio_only.ppm.
  # -----------------------------------------------------------------------
  homehub_ambient_host_compose:
    alias: HomeHub Ambient · Host · Compose
    description: Starts the selected dual-layer composition and selects HDMI3 whenever host visual or soundtrack output is requested.
    icon: mdi:layers-triple-outline
    mode: restart
    max_exceeded: silent
    fields:
      visual:
        name: Visual catalog ID
        required: false
        default: ""
        selector:
          text:
      visual_enabled:
        name: Visual enabled
        required: true
        default: true
        selector:
          boolean:
      video_loop:
        name: Visual loop
        required: true
        default: true
        selector:
          boolean:
      video_random_start:
        name: Visual random start
        required: true
        default: true
        selector:
          boolean:
      original_volume:
        name: Original audio volume
        required: true
        default: 20
        selector:
          number:
            min: 0
            max: 100
            step: 1
      soundtrack:
        name: Soundtrack catalog ID
        required: false
        default: ""
        selector:
          text:
      soundtrack_loop:
        name: Soundtrack loop
        required: true
        default: true
        selector:
          boolean:
      soundtrack_random_start:
        name: Soundtrack random start
        required: true
        default: true
        selector:
          boolean:
      soundtrack_volume:
        name: Soundtrack volume
        required: true
        default: 100
        selector:
          number:
            min: 0
            max: 100
            step: 1
    sequence:
      - variables:
          selected_visual: >-
            {% set value = visual | default('', true) | string | lower | trim %}
            {{ '' if value in ['', 'no visual', 'none'] else value }}
          selected_soundtrack: >-
            {% set value = soundtrack | default('', true) | string | lower | trim %}
            {{ '' if value in ['', 'no soundtrack', 'none'] else value }}
          use_visual: >-
            {{ visual_enabled | default(true) | bool
               and selected_visual | length > 0 }}
          host_output_required: >-
            {{ use_visual or selected_soundtrack | length > 0 }}
          composition_json: >-
            {{ {
              'visual': selected_visual if use_visual else none,
              'visual_enabled': use_visual,
              'video_loop': video_loop | default(true) | bool,
              'video_random_start': video_random_start | default(true) | bool,
              'original_volume': original_volume | default(20) | float(20),
              'soundtrack': selected_soundtrack if selected_soundtrack | length > 0 else none,
              'soundtrack_loop': soundtrack_loop | default(true) | bool,
              'soundtrack_random_start': soundtrack_random_start | default(true) | bool,
              'soundtrack_volume': soundtrack_volume | default(100) | float(100)
            } | to_json }}

      - if:
          - condition: template
            value_template: "{{ host_output_required }}"
        then:
          # Proven discrete command; never wait for SmartThings source=hdmi3.
          - action: script.homehub_media_select_pc_source
            continue_on_error: true

      - action: rest_command.homehub_ambient_player_compose
        continue_on_error: true
        data:
          body: "{{ composition_json }}"
        response_variable: ambient_response

      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_response.get('status', 0)
                 if ambient_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected or could not start the composition"
            error: true

  # -----------------------------------------------------------------------
  # Partial live updates. Each script sends only one affected layer/property
  # set to PATCH /v2/state. The backend contract forbids touching an omitted
  # layer, so selections, loop changes, and mix changes preserve peer position.
  # -----------------------------------------------------------------------
  homehub_ambient_host_update_visual:
    alias: HomeHub Ambient · Host · Update Visual Only
    description: Replaces, enables, disables, or adjusts only the visual MPV layer.
    icon: mdi:television-play
    mode: restart
    max_exceeded: silent
    fields:
      visual:
        name: Visual catalog ID
        required: false
        default: ""
        selector:
          text:
      enabled:
        name: Visual enabled
        required: true
        default: true
        selector:
          boolean:
      loop:
        name: Visual loop
        required: true
        default: true
        selector:
          boolean:
      random_start:
        name: Visual random start on next load
        required: true
        default: true
        selector:
          boolean:
      volume:
        name: Original audio volume
        required: true
        default: 20
        selector:
          number:
            min: 0
            max: 100
            step: 1
      select_source:
        name: Select HDMI3 before update
        required: false
        default: true
        selector:
          boolean:
    sequence:
      - variables:
          selected_visual: >-
            {% set value = visual | default('', true) | string | lower | trim %}
            {{ '' if value in ['', 'no visual', 'none'] else value }}
          use_visual: >-
            {{ enabled | default(true) | bool and selected_visual | length > 0 }}
          patch_json: >-
            {% if use_visual %}
              {{ {'video': {
                'enabled': true,
                'media_id': selected_visual,
                'loop': loop | default(true) | bool,
                'random_start': random_start | default(true) | bool,
                'volume': volume | default(20) | float(20)
              }} | to_json }}
            {% else %}
              {{ {'video': {'enabled': false}} | to_json }}
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ use_visual and select_source | default(true) | bool }}"
        then:
          - action: script.homehub_media_select_pc_source
            continue_on_error: true
      - action: rest_command.homehub_ambient_player_state_patch
        continue_on_error: true
        data:
          body: "{{ patch_json }}"
        response_variable: ambient_patch_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_patch_response.get('status', 0)
                 if ambient_patch_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected the visual-only update"
            error: true

  homehub_ambient_host_update_soundtrack:
    alias: HomeHub Ambient · Host · Update Soundtrack Only
    description: Replaces, enables, disables, or adjusts only the soundtrack MPV layer.
    icon: mdi:music-note
    mode: restart
    max_exceeded: silent
    fields:
      soundtrack:
        name: Soundtrack catalog ID
        required: false
        default: ""
        selector:
          text:
      enabled:
        name: Soundtrack enabled
        required: true
        default: true
        selector:
          boolean:
      loop:
        name: Soundtrack loop
        required: true
        default: true
        selector:
          boolean:
      random_start:
        name: Soundtrack random start on next load
        required: true
        default: true
        selector:
          boolean:
      volume:
        name: Soundtrack volume
        required: true
        default: 100
        selector:
          number:
            min: 0
            max: 100
            step: 1
      select_source:
        name: Select HDMI3 before update
        required: false
        default: true
        selector:
          boolean:
    sequence:
      - variables:
          selected_soundtrack: >-
            {% set value = soundtrack | default('', true) | string | lower | trim %}
            {{ '' if value in ['', 'no soundtrack', 'none'] else value }}
          use_soundtrack: >-
            {{ enabled | default(true) | bool and selected_soundtrack | length > 0 }}
          patch_json: >-
            {% if use_soundtrack %}
              {{ {'soundtrack': {
                'enabled': true,
                'media_id': selected_soundtrack,
                'loop': loop | default(true) | bool,
                'random_start': random_start | default(true) | bool,
                'volume': volume | default(100) | float(100)
              }} | to_json }}
            {% else %}
              {{ {'soundtrack': {'enabled': false}} | to_json }}
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ use_soundtrack and select_source | default(true) | bool }}"
        then:
          - action: script.homehub_media_select_pc_source
            continue_on_error: true
      - action: rest_command.homehub_ambient_player_state_patch
        continue_on_error: true
        data:
          body: "{{ patch_json }}"
        response_variable: ambient_patch_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_patch_response.get('status', 0)
                 if ambient_patch_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected the soundtrack-only update"
            error: true

  homehub_ambient_host_update_visual_loop:
    alias: HomeHub Ambient · Host · Update Visual Loop Only
    description: Changes only the live video loop property. Does not load media, seek, change volume, or touch soundtrack.
    icon: mdi:repeat
    mode: restart
    max_exceeded: silent
    fields:
      loop:
        required: true
        selector:
          boolean:
    sequence:
      - variables:
          patch_json: >-
            {{ {'video': {'loop': loop | default(true) | bool}} | to_json }}
      - action: rest_command.homehub_ambient_player_state_patch
        continue_on_error: true
        data:
          body: "{{ patch_json }}"
        response_variable: ambient_patch_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_patch_response.get('status', 0)
                 if ambient_patch_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected the visual-loop-only update"
            error: true

  homehub_ambient_host_update_soundtrack_loop:
    alias: HomeHub Ambient · Host · Update Soundtrack Loop Only
    description: Changes only the live soundtrack loop property. Does not load media, seek, change volume, or touch video.
    icon: mdi:repeat
    mode: restart
    max_exceeded: silent
    fields:
      loop:
        required: true
        selector:
          boolean:
    sequence:
      - variables:
          patch_json: >-
            {{ {'soundtrack': {'loop': loop | default(true) | bool}} | to_json }}
      - action: rest_command.homehub_ambient_player_state_patch
        continue_on_error: true
        data:
          body: "{{ patch_json }}"
        response_variable: ambient_patch_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_patch_response.get('status', 0)
                 if ambient_patch_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected the soundtrack-loop-only update"
            error: true

  homehub_ambient_host_update_volumes:
    alias: HomeHub Ambient · Host · Update Volumes Only
    description: Changes both MPV volume properties without loading, seeking, or restarting either layer.
    icon: mdi:tune-vertical
    mode: restart
    max_exceeded: silent
    fields:
      original_volume:
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 1
      soundtrack_volume:
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 1
    sequence:
      - variables:
          patch_json: >-
            {{ {
              'video': {'volume': original_volume | default(0) | float(0)},
              'soundtrack': {'volume': soundtrack_volume | default(0) | float(0)}
            } | to_json }}
      - action: rest_command.homehub_ambient_player_state_patch
        continue_on_error: true
        data:
          body: "{{ patch_json }}"
        response_variable: ambient_patch_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_patch_response.get('status', 0)
                 if ambient_patch_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected the volume-only update"
            error: true

  homehub_ambient_host_update_audio:
    alias: HomeHub Ambient · Host · Update Audio Only
    description: Toggles/restores host audio without restarting the visual layer.
    icon: mdi:music-circle
    mode: restart
    max_exceeded: silent
    fields:
      audio_enabled:
        required: true
        selector:
          boolean:
      soundtrack:
        required: false
        default: ""
        selector:
          text:
      soundtrack_loop:
        required: true
        default: true
        selector:
          boolean:
      soundtrack_random_start:
        required: true
        default: true
        selector:
          boolean:
      original_volume:
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 1
      soundtrack_volume:
        required: true
        selector:
          number:
            min: 0
            max: 100
            step: 1
    sequence:
      - variables:
          selected_soundtrack: >-
            {% set value = soundtrack | default('', true) | string | lower | trim %}
            {{ '' if value in ['', 'no soundtrack', 'none'] else value }}
          use_audio: "{{ audio_enabled | default(true) | bool }}"
          use_soundtrack: "{{ use_audio and selected_soundtrack | length > 0 }}"
          patch_json: >-
            {% set soundtrack_patch = {'enabled': false} %}
            {% if use_soundtrack %}
              {% set soundtrack_patch = {
                'enabled': true,
                'media_id': selected_soundtrack,
                'loop': soundtrack_loop | default(true) | bool,
                'random_start': soundtrack_random_start | default(true) | bool,
                'volume': soundtrack_volume | default(100) | float(100)
              } %}
            {% endif %}
            {{ {
              'video': {'volume': (original_volume | default(20) | float(20)) if use_audio else 0},
              'soundtrack': soundtrack_patch
            } | to_json }}
      - if:
          - condition: template
            value_template: "{{ use_soundtrack }}"
        then:
          - action: script.homehub_media_select_pc_source
            continue_on_error: true
      - action: rest_command.homehub_ambient_player_state_patch
        continue_on_error: true
        data:
          body: "{{ patch_json }}"
        response_variable: ambient_patch_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_patch_response.get('status', 0)
                 if ambient_patch_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected the audio-only update"
            error: true

  # -----------------------------------------------------------------------
  # Stored profile playback. Read the profile first so HDMI3 is selected for
  # either a real visual or a host soundtrack guarded by audio_only.ppm.
  # -----------------------------------------------------------------------
  homehub_ambient_host_play_profile:
    alias: HomeHub Ambient · Host · Play Profile
    description: Starts a validated saved mode profile and selects HDMI3 when it contains an enabled visual or host soundtrack.
    icon: mdi:play-box-multiple-outline
    mode: restart
    max_exceeded: silent
    fields:
      profile_id:
        name: Profile ID
        required: true
        selector:
          select:
            options:
              - fireplace
              - dog_tv
              - dinner
              - reading
              - game_night
              - chill
              - demo_mix
    sequence:
      - variables:
          requested_profile: "{{ profile_id | default('', true) | string | lower | trim }}"
          allowed_profiles:
            - fireplace
            - dog_tv
            - dinner
            - reading
            - game_night
            - chill
            - demo_mix
      - if:
          - condition: template
            value_template: "{{ requested_profile not in allowed_profiles }}"
        then:
          - stop: "Refusing unknown ambient profile"
            error: true

      - action: rest_command.homehub_ambient_player_profile_get
        continue_on_error: true
        data:
          profile_id: "{{ requested_profile }}"
        response_variable: ambient_profile_response

      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_profile_response.get('status', 0)
                 if ambient_profile_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient profile is unavailable"
            error: true

      - variables:
          profile_content: "{{ ambient_profile_response.get('content', {}) }}"

      # Backend v2.1 can return HTTP 200 for a known-but-stale profile while
      # explicitly reporting available:false. Reject it before HDMI3 or play.
      - if:
          - condition: template
            value_template: >-
              {{ profile_content.get('available', true) == false }}
        then:
          - stop: >-
              Ambient profile is unavailable: {{ profile_content.get('error', 'stale or missing media') }}
            error: true

      - variables:
          profile_visual_enabled: >-
            {{ profile_content.get('profile', {}).get('visual_enabled', false) | bool
               and profile_content.get('profile', {}).get('visual') is not none }}
          profile_soundtrack_present: >-
            {{ profile_content.get('profile', {}).get('soundtrack') is not none }}

      - if:
          - condition: template
            value_template: "{{ profile_visual_enabled or profile_soundtrack_present }}"
        then:
          - action: script.homehub_media_select_pc_source
            continue_on_error: true

      - action: rest_command.homehub_ambient_player_profile_play
        continue_on_error: true
        data:
          profile_id: "{{ requested_profile }}"
        response_variable: ambient_response

      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_response.get('status', 0)
                 if ambient_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected or could not start the profile"
            error: true

  # -----------------------------------------------------------------------
  # v1-compatible one-file scene playback retained for old callers and
  # non-profile debug scripts.
  # -----------------------------------------------------------------------
  homehub_ambient_host_play:
    alias: HomeHub Ambient · Host · Play
    description: Starts one allowlisted legacy visual on the HDMI-attached Ubuntu host.
    icon: mdi:play-network
    mode: restart
    max_exceeded: silent
    fields:
      scene:
        name: Scene
        required: true
        selector:
          select:
            options:
              - fireplace
              - aquarium
              - dog_tv
              - hogwarts
              - rain
              - ocean
              - forest
              - space
              - abstract
              - sample
    sequence:
      - variables:
          requested_scene: "{{ scene | default('', true) | lower | trim }}"
          allowed_scenes:
            - fireplace
            - aquarium
            - dog_tv
            - hogwarts
            - rain
            - ocean
            - forest
            - space
            - abstract
            - sample
      - if:
          - condition: template
            value_template: "{{ requested_scene not in allowed_scenes }}"
        then:
          - stop: "Refusing unknown ambient scene"
            error: true
      - action: script.homehub_media_select_pc_source
        continue_on_error: true
      - action: rest_command.homehub_ambient_player_play
        continue_on_error: true
        data:
          scene: "{{ requested_scene }}"
        response_variable: ambient_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_response.get('status', 0)
                 if ambient_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected or could not start the scene"
            error: true

  homehub_ambient_host_stop:
    alias: HomeHub Ambient · Host · Stop
    description: Stops both host-side playback layers.
    icon: mdi:stop-circle-outline
    mode: restart
    sequence:
      - action: rest_command.homehub_ambient_player_stop
        continue_on_error: true
        response_variable: ambient_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_response.get('status', 0)
                 if ambient_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected or could not stop playback"
            error: true

  homehub_ambient_host_pause:
    alias: HomeHub Ambient · Host · Pause
    description: Pauses both host-side playback layers.
    icon: mdi:pause-circle-outline
    mode: restart
    sequence:
      - action: rest_command.homehub_ambient_player_pause
        continue_on_error: true
        response_variable: ambient_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_response.get('status', 0)
                 if ambient_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected or could not pause playback"
            error: true

  homehub_ambient_host_resume:
    alias: HomeHub Ambient · Host · Resume
    description: Resumes both host-side playback layers.
    icon: mdi:play-circle-outline
    mode: restart
    sequence:
      - action: rest_command.homehub_ambient_player_resume
        continue_on_error: true
        response_variable: ambient_response
      - if:
          - condition: template
            value_template: >-
              {% set status = ambient_response.get('status', 0)
                 if ambient_response is defined else 0 %}
              {{ status < 200 or status >= 300 }}
        then:
          - stop: "Ambient host rejected or could not resume playback"
            error: true

  homehub_ambient_host_fireplace:
    alias: HomeHub Ambient · Host · Fireplace
    icon: mdi:fireplace
    mode: restart
    sequence:
      - action: script.homehub_ambient_host_play_profile
        data:
          profile_id: fireplace

  homehub_ambient_host_dog_tv:
    alias: HomeHub Ambient · Host · DOG TV
    icon: mdi:dog
    mode: restart
    sequence:
      - action: script.homehub_ambient_host_play_profile
        data:
          profile_id: dog_tv

  homehub_ambient_host_aquarium:
    alias: HomeHub Ambient · Host · Aquarium
    icon: mdi:fishbowl-outline
    mode: restart
    sequence:
      - action: script.homehub_ambient_host_play
        data: {scene: aquarium}

