name: Validate
on: { push: {}, pull_request: {}, schedule: [{ cron: "0 3 * * 1" }], workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      # hacs/action and hassfest are used at their documented moving refs (@main/@master), not pinned.
      - uses: hacs/action@main
        with: { category: integration }
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: home-assistant/actions/hassfest@master  # documented usage; not pinned
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with: { node-version: 22 }
      - run: uv venv .venv --python 3.14 && uv pip install -p .venv -r requirements_test.txt
      - run: .venv/bin/ruff check custom_components tests media-pc
      - run: .venv/bin/pytest -q
      - run: node --test tests/js/*.test.mjs
