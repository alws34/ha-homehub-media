name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please leave out tokens, API keys and real LAN addresses (use 192.0.2.x). Security problems go through
        the Security tab, not here.
  - type: input
    id: version
    attributes:
      label: HomeHub Media version
      description: Settings › Devices & services › HomeHub Media, or HACS.
      placeholder: "0.3.5"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.4"
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model and Tizen version
      placeholder: "QE55Q60B, Tizen 6.5"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup or pairing
        - TV remote, apps or typing
        - Ambience (TV page or media PC)
        - YouTube ambience
        - Plex or Jellyfin library
        - Voice assistant
        - Lovelace card
        - Media-PC daemons
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: See "Enable debug logging" in the README. Check it for tokens before pasting.
      render: text
