version: 2
# Monthly version updates, one grouped PR per ecosystem, against the default branch (main).
# Security fixes open as soon as an alert does.
updates:
  # SHA-pinned actions in .github/workflows (the comment after each SHA is kept up to date).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # requirements_test.txt: exact test pins. Dependabot only bumps the test tooling:
  # pytest-homeassistant-custom-component (it fixes the Home Assistant version under test) and ruff.
  # The others must equal what that Home Assistant release pins (homeassistant/package_constraints.txt and
  # the frontend, conversation and samsungtv manifests), or manifest.json's own requirements, so they are
  # updated by hand in the same commit as the pytest-homeassistant-custom-component bump.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: home-assistant-frontend
      - dependency-name: home-assistant-intents
      - dependency-name: hassil
      - dependency-name: gazetteer-matcher
      - dependency-name: samsungtvws
      - dependency-name: pyytlounge
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
